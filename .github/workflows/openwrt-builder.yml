name: OpenWrt Builder

permissions:
  contents: write

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        if [ -e "$FEEDS_CONF" ]; then
          cat "$FEEDS_CONF" >> openwrt/feeds.conf.default
        fi
        # TurboACC is no longer installed; no part-1 installer is run.

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Add Argon theme package
      run: |
        ARGON_COMMIT=076355f33cd762172a67fa06ec6bd2230d9d9e09
        git clone https://github.com/jerrykuku/luci-theme-argon.git /tmp/luci-theme-argon
        git -C /tmp/luci-theme-argon checkout --detach "$ARGON_COMMIT"
        mkdir -p openwrt/package/luci-theme-argon
        git -C /tmp/luci-theme-argon archive "$ARGON_COMMIT" | tar -x -C openwrt/package/luci-theme-argon
        test -f openwrt/package/luci-theme-argon/Makefile

    - name: Exclude unused WeeChat LuCI package
      run: |
        cd openwrt
        ./scripts/feeds uninstall luci-app-weechat
        if find package/feeds -name 'luci-app-weechat' -print -quit | grep -q .; then
          echo "ERROR: luci-app-weechat is still installed in package feeds"
          exit 1
        fi

    - name: Add WeChat Push package
      run: |
        WECHATPUSH_COMMIT=e7d4d49b14f3755039cc236130afa7cfc65b1e09
        git clone https://github.com/tty228/luci-app-wechatpush.git /tmp/luci-app-wechatpush
        git -C /tmp/luci-app-wechatpush checkout --detach "$WECHATPUSH_COMMIT"
        mkdir -p openwrt/package/luci-app-wechatpush
        git -C /tmp/luci-app-wechatpush archive "$WECHATPUSH_COMMIT" | tar -x -C openwrt/package/luci-app-wechatpush
        test -f openwrt/package/luci-app-wechatpush/Makefile
        test -f openwrt/package/luci-app-wechatpush/po/zh_Hans/wechatpush.po

    - name: Add vlmcsd server package
      run: |
        test -f package/vlmcsd/Makefile
        mkdir -p openwrt/package/vlmcsd
        cp -a package/vlmcsd/. openwrt/package/vlmcsd/

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        set -x
        make defconfig
        # LuCI must use the official Nginx collection, never uhttpd.
        grep -q '^CONFIG_PACKAGE_luci-nginx=y' .config
        ! grep -q '^CONFIG_PACKAGE_luci=y' .config
        ! grep -q '^CONFIG_PACKAGE_luci-ssl=y' .config
        grep -q '^CONFIG_PACKAGE_nginx-full=y' .config
        ! grep -q '^CONFIG_PACKAGE_nginx-ssl=y' .config
        grep -q '^CONFIG_PACKAGE_nginx-mod-luci=y' .config
        grep -q '^CONFIG_PACKAGE_nginx-mod-ubus=y' .config
        grep -q '^CONFIG_PACKAGE_uwsgi-luci-support=y' .config
        ! grep -q '^CONFIG_PACKAGE_uhttpd[^=]*=y' .config
        test -f package/vlmcsd/Makefile
        grep -q '^CONFIG_PACKAGE_vlmcsd=y' .config
        grep -q '^CONFIG_PACKAGE_luci-app-wechatpush=y' .config
        grep -q '^CONFIG_PACKAGE_luci-app-wechatpush_Local_Disk_Information_Detection=y' .config
        grep -q '^CONFIG_PACKAGE_luci-app-wechatpush_Host_Information_Detection=y' .config
        ! grep -q '^CONFIG_PACKAGE_luci-app-wechatpush_Enable_Traffic_Monitoring=y' .config
        grep -q '^CONFIG_PACKAGE_luci-i18n-wechatpush-zh-cn=y' .config
        ! grep -q '^CONFIG_PACKAGE_luci-app-vlmcsd=y' .config
        ! grep -q '^CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y' .config
        grep -q '^CONFIG_TARGET_x86_64=y' .config
        grep -q '^CONFIG_TARGET_ROOTFS_EXT4FS=y' .config
        grep -q '^CONFIG_GRUB_IMAGES=y' .config
        grep -q '^CONFIG_GRUB_EFI_IMAGES=y' .config
        ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc=y' .config
        ! grep -q '^CONFIG_PACKAGE_TURBOACC_' .config
        grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y' .config
        grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y' .config
        test ! -d package/turboacc
        # Keep upstream LuCI firewall controls; only SONiC's Fullcone patch is added.
        grep -q "Netfilter flow offload support" feeds/luci/applications/luci-app-firewall/htdocs/luci-static/resources/view/firewall/zones.js
        ! grep -q "Flow offloading type" feeds/luci/applications/luci-app-firewall/htdocs/luci-static/resources/view/firewall/zones.js
        test ! -e files/usr/libexec/luci-firewall-status
        test ! -e files/etc/init.d/tcp-cca
        test -f files/etc/uci-defaults/zz-sonic-fullcone
        test -f package/network/config/firewall4/patches/001-sonic-fullcone.patch
        test -f feeds/luci/applications/luci-app-firewall/patches/001-add-fullcone-options.patch
        test -f package/libs/libnftnl/patches/001-libnftnl-add-fullcone-expression-support.patch
        test -f package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch
        find target/linux/generic/hack-* -maxdepth 1 -name '984-add-sonic-fullcone-support.patch' -print -quit | grep -q .
        grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y' .config
        grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config
        grep -q '^CONFIG_KERNEL_XDP_SOCKETS=y' .config

        # Fail early if a requested package is missing from the configured feeds.
        for pkg in \
          luci-app-passwall2 sing-box xray-core hysteria \
          docker dockerd docker-compose luci-app-dockerman \
          cloudflared luci-app-cloudflared ddns-scripts-cloudflare luci-app-ddns \
          acme-acmesh acme-acmesh-dnsapi luci-app-acme frpc luci-app-frpc zerotier \
          netdata nlbwmon luci-app-nlbwmon \
          iperf3-ssl tcpdump nmap bind-host smartmontools ethtool-full \
          kmod-sched-cake luci-theme-argon \
          luci-app-wechatpush luci-app-wol etherwake vlmcsd qemu-ga \
          procps-ng-watch rclone luci-app-ttyd luci-i18n-ttyd-zh-cn \
          kmod-fuse kmod-macvlan
        do
          grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || { echo "ERROR: requested package not selected: ${pkg}"; exit 1; }
        done

        set +x
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

