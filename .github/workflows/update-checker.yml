#
# Official OpenWrt source update checker
# Checks the selected ref in https://github.com/openwrt/openwrt
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    # Check upstream once a week (Monday 14:00 Beijing time / 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: upstream-update-checker-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$REPO_URL"
          git -C upstream fetch --depth=1 origin "$REPO_BRANCH"
          commit="$(git -C upstream rev-parse FETCH_HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Official OpenWrt ref: $REPO_BRANCH"
          echo "Commit: $commit"

      - name: Compare upstream commit
        id: cache
        uses: actions/cache@v4
        with:
          path: .commitHash
          key: openwrt-${{ env.REPO_BRANCH }}-${{ steps.upstream.outputs.commit }}

      - name: Save new commit hash
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf '%s\n' "${{ steps.upstream.outputs.commit }}" > .commitHash

      - name: Trigger firmware build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: source-code-update

      - name: Notify Telegram about upstream update
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::warning::Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          message=$(printf '🚀 OpenWrt 上游源码发现更新\n\n仓库：openwrt/openwrt\n分支：%s\nCommit：%s\n\n状态：已成功发送自动编译触发事件\n工作流：%s' \
            "$REPO_BRANCH" "$UPSTREAM_COMMIT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")

          payload=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')

          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "$payload"
