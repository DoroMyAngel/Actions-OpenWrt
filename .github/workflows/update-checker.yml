#
# OpenWrt kernel version update checker
# Checks the active x86_64 kernel version in https://github.com/openwrt/openwrt
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    # Check upstream daily at 14:00 Beijing time (06:00 UTC).
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-update-checker-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get upstream kernel version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git init -b main upstream
          git -C upstream remote add origin "$REPO_URL"
          git -C upstream fetch --depth=1 origin "$REPO_BRANCH"
          # Fetch updates FETCH_HEAD but does not populate the working tree.
          # Check out the fetched commit before reading source files below.
          git -C upstream checkout --detach FETCH_HEAD
          commit="$(git -C upstream rev-parse HEAD)"

          # Resolve the kernel patch series selected by the x86 target.
          patchver="$(sed -nE 's/^[[:space:]]*KERNEL_PATCHVER[[:space:]]*[:?+]?=[[:space:]]*([^[:space:]#]+).*/\1/p' upstream/target/linux/x86/Makefile | head -n1)"
          if [[ -z "$patchver" ]]; then
            echo "::error::Unable to determine KERNEL_PATCHVER from target/linux/x86/Makefile"
            exit 1
          fi

          # The full kernel version suffix is defined in the per-series
          # target/linux/generic/kernel-<patchver> file, not kernel-version.mk.
          kernel_details="upstream/target/linux/generic/kernel-${patchver}"
          if [[ ! -f "$kernel_details" ]]; then
            echo "::error::Kernel details file not found: ${kernel_details}"
            exit 1
          fi

          kernel_suffix="$(awk -v key="LINUX_VERSION-${patchver}" '$1 == key && $2 == "=" {print $3; exit}' "$kernel_details")"
          if [[ -z "$kernel_suffix" ]]; then
            echo "::error::Unable to resolve Linux kernel version for patch series ${patchver} from ${kernel_details}"
            exit 1
          fi

          kernel_version="${patchver}${kernel_suffix}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "kernel_version=$kernel_version" >> "$GITHUB_OUTPUT"
          echo "OpenWrt ref: $REPO_BRANCH"
          echo "x86 KERNEL_PATCHVER: $patchver"
          echo "Linux kernel version: $kernel_version"
          echo "Commit: $commit"

      - name: Compare upstream kernel version
        id: cache
        uses: actions/cache@v4
        with:
          path: .kernelVersion
          key: openwrt-x86_64-kernel-${{ steps.upstream.outputs.kernel_version }}

      - name: Save new kernel version
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf '%s\n' "${{ steps.upstream.outputs.kernel_version }}" > .kernelVersion

      - name: Trigger firmware build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: source-code-update

      - name: Notify Telegram about kernel update
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KERNEL_VERSION: ${{ steps.upstream.outputs.kernel_version }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::warning::Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          message=$(printf '🚀 OpenWrt Linux 内核版本发现更新\n\n仓库：openwrt/openwrt\n分支：%s\n内核版本：%s\nCommit：%s\n\n状态：已成功发送自动编译触发事件\n工作流：%s' \
            "$REPO_BRANCH" "$KERNEL_VERSION" "$UPSTREAM_COMMIT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")

          payload=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')

          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "$payload"
