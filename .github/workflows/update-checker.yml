#
# Official OpenWrt 25.12 stable release checker
# Tracks the newest official v25.12.x stable tag, excluding snapshots and prereleases.
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-update-checker-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  RELEASE_SERIES: "25.12"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest stable release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          git init upstream
          git -C upstream remote add origin "$REPO_URL"

          latest_tag="$(
            git ls-remote --tags --refs "$REPO_URL" "refs/tags/v${RELEASE_SERIES}.*" |
              awk '{ sub("refs/tags/", "", $2); if ($2 ~ /^v25\.12\.[0-9]+$/) print $2 }' |
              sort -V |
              tail -n1
          )"

          if [[ -z "$latest_tag" ]]; then
            echo "::error::No official stable tag found for OpenWrt ${RELEASE_SERIES}"
            exit 1
          fi

          git -C upstream fetch --depth=1 origin "refs/tags/$latest_tag:refs/tags/$latest_tag"
          commit="$(git -C upstream rev-parse "$latest_tag^{commit}")"

          echo "stable_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Latest official stable release: $latest_tag"
          echo "Commit: $commit"

      - name: Compare upstream stable release
        id: cache
        uses: actions/cache@v4
        with:
          path: .commitHash
          key: openwrt-${{ steps.upstream.outputs.stable_tag }}-${{ steps.upstream.outputs.commit }}

      - name: Save new stable release
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf '%s\n' "${{ steps.upstream.outputs.commit }}" > .commitHash

      - name: Trigger OpenWrt 25.12 stable firmware build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.upstream.outputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg ref "openwrt-25.12" --arg source_ref "$SOURCE_REF" \
            '{ref: $ref, inputs: {source_ref: $source_ref}}')
          curl --fail --silent --show-error --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/openwrt-builder.yml/dispatches" \
            -d "$payload"

      - name: Notify Telegram about upstream stable release
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.stable_tag }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::warning::Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          message=$(printf '🚀 OpenWrt 25.12 发布了新的正式稳定版\n\n仓库：openwrt/openwrt\n稳定版本：%s\nCommit：%s\n\n状态：已触发对应稳定版源码的自动编译\n工作流：%s' \
            "$UPSTREAM_TAG" "$UPSTREAM_COMMIT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")

          payload=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')

          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: application/json" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "$payload"
